# Veroeffentlicht ausschliesslich das Next.js-Frontend (frontend/) als
# statischen Export auf GitHub Pages - fuer den Testbetrieb, siehe
# README.md, Abschnitt "Testbetrieb auf GitHub Pages". GitHub Pages liefert
# nur statische Dateien aus; das FastAPI-Backend (backend/) muss weiterhin
# separat gehostet werden (z.B. Render/Fly.io/eigener Server) und seine
# Adresse als Repository-Variable NEXT_PUBLIC_API_URL hinterlegt sein
# (Settings -> Secrets and variables -> Actions -> Variables), sonst faellt
# der Build auf den lokalen Entwicklungs-Default zurueck und die
# veroeffentlichte Seite kann sich von dort aus nicht mit dem Backend
# verbinden.
name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-pages.yml"
  # Manuell auslösbar, z.B. um nach dem Setzen/Aendern von
  # NEXT_PUBLIC_API_URL neu zu deployen, ohne extra einen Commit zu brauchen.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig - ein zweiter, waehrend der erste noch laeuft,
# wird nicht abgebrochen (cancel-in-progress: false), sondern wartet, damit
# nie eine aeltere Version eine neuere ueberschreibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: frontend
        run: npm ci

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      # basePath = "" fuer eine Nutzer-/Org-Root-Seite (Repo heisst
      # "<owner>.github.io"), sonst "/<repo-name>" fuer eine gewoehnliche
      # Projekt-Seite (https://<owner>.github.io/<repo-name>/) - siehe
      # frontend/next.config.js, das daraus basePath/assetPrefix ableitet.
      - name: Statischen Export bauen
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: npm run build

      # GitHub Pages ignoriert sonst per Default Ordner/Dateien mit
      # fuehrendem Unterstrich (Jekyll-Konvention) - beträfe hier
      # Next.js' eigenen "_next"-Ordner mit allen JS-/CSS-Bundles.
      - name: .nojekyll ergaenzen
        run: touch frontend/out/.nojekyll

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
